name: 7key secrets
description: Load one environment of a 7key project into the job, with secret values masked.
author: 7key
branding:
  icon: key
  color: orange
inputs:
  link:
    description: Repository link from the 7key console (organization.link).
    required: true
  key:
    description: Repository key from the 7key console. Store it as a GitHub secret.
    required: true
  server:
    description: 7key server.
    required: false
    default: https://7key.online
runs:
  using: node24
  main: dist/index.mjs
