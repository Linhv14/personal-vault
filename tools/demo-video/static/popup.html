<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>Popup harness</title>
    <script>
      const A = __ACCOUNTS__;
      const who = new URLSearchParams(location.search).get("as") || "owner";
      const a = A[who];
      const locked = new URLSearchParams(location.search).has("locked");
      const fresh = new URLSearchParams(location.search).has("fresh");
      const mk = (m) => ({
        get: async (k) => {
          if (k === null || k === undefined) return Object.fromEntries(m);
          const l = typeof k === "string" ? [k] : Array.isArray(k) ? k : Object.keys(k);
          return Object.fromEntries(l.filter((x) => m.has(x)).map((x) => [x, m.get(x)]));
        },
        set: async (p) => {
          for (const [k, v] of Object.entries(p)) m.set(k, v);
        },
        remove: async (k) => {
          for (const x of typeof k === "string" ? [k] : k) m.delete(x);
        },
        clear: async () => m.clear(),
      });
      const local = new Map(
        fresh
          ? [["locale", new URLSearchParams(location.search).get("locale") || "vi"]]
          : [
              ["apiUrl", location.origin],
              ["email", a.email],
              ["kdf", a.record.kdf],
              ["wrappedVaultKey", a.record.wrappedVaultKey],
              ["locale", new URLSearchParams(location.search).get("locale") || "vi"],
            ],
      );
      const session = new Map(
        locked || fresh
          ? []
          : [
              ["vaultKeyRaw", a.raw],
              ["token", a.token],
            ],
      );
      const ev = { addListener() {}, removeListener() {} };
      window.chrome = {
        storage: { local: mk(local), session: mk(session), onChanged: ev },
        permissions: {
          contains: async () => false,
          request: async () => false,
          remove: async () => true,
        },
        alarms: { create: async () => {}, clear: async () => true },
        runtime: {
          id: "harness",
          getManifest: () => ({ version: "dev" }),
          getURL: (p) => "/" + p,
          sendMessage: async () => undefined,
          onMessage: ev,
          getContexts: async () => [],
        },
        tabs: {
          query: async () => [
            { id: 1, url: "https://github.com/login", title: "Sign in to GitHub" },
          ],
          create: async () => {},
          captureVisibleTab: async () => "",
        },
        action: { openPopup: async () => {} },
        scripting: {
          getRegisteredContentScripts: async () => [],
          registerContentScripts: async () => {},
          unregisterContentScripts: async () => {},
        },
      };
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
