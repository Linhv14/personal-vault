<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>stage</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #0b0a09;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
        color: #f4f1ee;
      }
      #bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(800px 480px at 15% -10%, rgba(255, 106, 61, 0.22), transparent 60%),
          radial-gradient(700px 500px at 110% 110%, rgba(255, 181, 71, 0.14), transparent 60%);
      }
      #grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse 70% 70% at 50% 40%, #000, transparent 80%);
      }
      #camera {
        position: absolute;
        inset: 0;
        transform-origin: 0 0;
        transition: transform 0.6s cubic-bezier(0.65, 0, 0.25, 1);
      }
      #device {
        position: absolute;
        border-radius: 14px;
        overflow: hidden;
        box-shadow:
          0 40px 100px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(255, 255, 255, 0.09);
        opacity: 0;
        transition:
          opacity 0.45s,
          transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        transform: translateY(24px) scale(0.97);
      }
      #device.on {
        opacity: 1;
        transform: none;
      }
      #device iframe {
        display: block;
        border: 0;
        background: #121110;
        transform-origin: 0 0;
      }
      #cursor {
        position: absolute;
        left: 0;
        top: 0;
        width: 22px;
        height: 22px;
        opacity: 0;
        transition:
          transform 0.55s cubic-bezier(0.65, 0, 0.25, 1),
          opacity 0.3s;
        filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
        z-index: 5;
      }
      #ripple {
        position: absolute;
        width: 12px;
        height: 12px;
        margin: -6px 0 0 -6px;
        border-radius: 50%;
        border: 2px solid #ff6a3d;
        opacity: 0;
        z-index: 4;
      }
      #ripple.go {
        animation: rip 0.5s ease-out;
      }
      @keyframes rip {
        from {
          opacity: 1;
          transform: scale(1);
        }
        to {
          opacity: 0;
          transform: scale(5);
        }
      }
      #cap {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        padding: 30px 0 40px;
        text-align: center;
        z-index: 6;
        background: linear-gradient(180deg, rgba(6, 9, 10, 0.96) 55%, rgba(6, 9, 10, 0));
      }
      #cap .k {
        display: inline-block;
        margin-bottom: 10px;
        padding: 3px 10px;
        border-radius: 999px;
        background: rgba(255, 106, 61, 0.16);
        color: #ff6a3d;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      #cap h2 {
        margin: 0;
        font-size: 40px;
        line-height: 1.02;
        letter-spacing: -1.4px;
        font-weight: 780;
        text-shadow: 0 6px 30px rgba(0, 0, 0, 0.6);
      }
      #cap h2 b {
        background: linear-gradient(100deg, #ff6a3d, #ffb547);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #cap.in .k,
      #cap.in h2 {
        animation: up 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      #cap.in h2 {
        animation-delay: 0.06s;
      }
      #cap.out {
        opacity: 0;
        transition: opacity 0.25s;
      }
      @keyframes up {
        from {
          opacity: 0;
          transform: translateY(22px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      #card {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 20px;
        opacity: 0;
        transition: opacity 0.4s;
        z-index: 7;
      }
      #card.on {
        opacity: 1;
      }
      #card h1 {
        margin: 0;
        font-size: 120px;
        letter-spacing: -5px;
        font-weight: 800;
        line-height: 1;
      }
      #card h1 b {
        color: #ff6a3d;
      }
      #card.on h1,
      #card.on p,
      #card.on .tile,
      #card.on pre {
        animation: pop 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      #card.on p {
        animation-delay: 0.12s;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.92) translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      #card p {
        margin: 0;
        font-size: 26px;
        color: #aaa29b;
      }
      #card .big {
        font-size: 56px;
        color: #f4f1ee;
        font-weight: 780;
        letter-spacing: -1.8px;
        line-height: 1.05;
      }
      #card .big b {
        background: linear-gradient(100deg, #ff6a3d, #ffb547);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #card pre {
        margin: 0;
        padding: 26px 30px;
        border-radius: 16px;
        background: #171513;
        border: 1px solid rgba(255, 255, 255, 0.09);
        text-align: left;
        font:
          22px/1.65 ui-monospace,
          Menlo,
          monospace;
        color: #e6dfd8;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
      }
      #card pre i {
        font-style: normal;
        color: #ff6a3d;
      }
      #card .row {
        display: flex;
        gap: 18px;
      }
      #card .tile {
        width: 250px;
        padding: 22px;
        border-radius: 16px;
        background: #171513;
        border: 1px solid rgba(255, 255, 255, 0.09);
        text-align: left;
      }
      #card .tile strong {
        display: block;
        font-size: 20px;
        margin-bottom: 6px;
      }
      #card .tile span {
        color: #aaa29b;
        font-size: 16px;
      }
      #card .cta {
        margin-top: 8px;
        padding: 14px 26px;
        border-radius: 999px;
        background: #ff6a3d;
        color: #1b0a03;
        font-weight: 750;
        font-size: 20px;
      }

      .dg {
        display: flex;
        align-items: center;
        gap: 26px;
      }
      .node {
        width: 200px;
        padding: 20px;
        border-radius: 18px;
        background: #171513;
        border: 1px solid rgba(255, 255, 255, 0.1);
        text-align: left;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }
      .node .ic {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: rgba(255, 106, 61, 0.14);
        color: #ff6a3d;
        font-size: 22px;
        margin-bottom: 14px;
      }
      .node strong {
        display: block;
        font-size: 20px;
        margin-bottom: 4px;
      }
      .node span {
        color: #aaa29b;
        font-size: 15px;
      }
      .node.srv .ic {
        background: rgba(255, 181, 71, 0.14);
        color: #ffb547;
      }
      .pkt {
        position: absolute;
        top: -13px;
        left: 0;
        padding: 4px 8px;
        border-radius: 8px;
        background: #ff6a3d;
        color: #1b0a03;
        font:
          700 12px ui-monospace,
          Menlo,
          monospace;
        animation: fly 1.6s cubic-bezier(0.6, 0, 0.3, 1) infinite;
      }
      @keyframes fly {
        0% {
          left: -20px;
          opacity: 0;
        }
        15% {
          opacity: 1;
        }
        85% {
          opacity: 1;
        }
        100% {
          left: 60px;
          opacity: 0;
        }
      }
      .stg > * {
        animation: pop 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .stg > *:nth-child(2) {
        animation-delay: 0.25s;
      }
      .stg > *:nth-child(3) {
        animation-delay: 0.5s;
      }
      .stg > *:nth-child(4) {
        animation-delay: 0.75s;
      }
      .stg > *:nth-child(5) {
        animation-delay: 1s;
      }
      .stg > *:nth-child(6) {
        animation-delay: 1.25s;
      }
      .stg > *:nth-child(7) {
        animation-delay: 1.5s;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .box {
        padding: 14px 18px;
        border-radius: 14px;
        background: #171513;
        border: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 18px;
        font-weight: 650;
        text-align: left;
        min-width: 170px;
      }
      .box small {
        display: block;
        color: #aaa29b;
        font-weight: 500;
        font-size: 13px;
        margin-bottom: 2px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .box.hl {
        border-color: rgba(255, 106, 61, 0.5);
        background: linear-gradient(180deg, rgba(255, 106, 61, 0.1), #171513);
      }
      .envs {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .envs i {
        font-style: normal;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
        font-size: 13px;
        font-weight: 600;
        color: #e6dfd8;
      }
      .win {
        width: 860px;
        border-radius: 16px;
        overflow: hidden;
        background: #141210;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
        text-align: left;
      }
      .win .bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        color: #aaa29b;
        font-size: 14px;
      }
      .win .bar i {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.14);
      }
      .win .bar strong {
        color: #f4f1ee;
        margin-left: 8px;
      }
      .step {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 18px;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        font-size: 16px;
      }
      .step .ok {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #2ea043;
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 12px;
      }
      .step .t {
        margin-left: auto;
        color: #7d8590;
        font-size: 13px;
      }
      .log {
        padding: 6px 18px 14px 50px;
        font:
          14.5px/1.75 ui-monospace,
          Menlo,
          monospace;
        color: #c9d1d9;
      }
      .log div {
        white-space: pre;
      }
      .log .g {
        color: #3fb950;
      }
      .log .m {
        color: #7d8590;
      }
      .log .a {
        color: #ff6a3d;
      }
      .lines > * {
        opacity: 0;
        animation: show 0.01s forwards;
      }
      @keyframes show {
        to {
          opacity: 1;
        }
      }
      .term {
        width: 900px;
        border-radius: 16px;
        overflow: hidden;
        background: #131313;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
        text-align: left;
      }
      .term .body {
        padding: 20px 24px;
        font:
          16px/1.7 ui-monospace,
          Menlo,
          monospace;
        color: #e6e6e6;
      }
      .term .p {
        color: #d97757;
      }
      .term .u {
        color: #fff;
        font-weight: 700;
      }
      .term .tool {
        color: #ff6a3d;
      }
      .term .dim {
        color: #8a8a8a;
      }
      .term .ph {
        color: #f3b562;
      }
      .flow {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 20px;
        font-size: 15px;
      }
      .flow .box {
        min-width: 0;
        padding: 10px 14px;
        font-size: 15px;
      }
      .soonb {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 999px;
        background: rgba(255, 181, 71, 0.16);
        color: #ffb547;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .ttl {
        font-size: 40px;
        font-weight: 780;
        letter-spacing: -1.2px;
        line-height: 1.05;
        margin-bottom: 6px;
      }
      .ttl b {
        background: linear-gradient(100deg, #ff6a3d, #ffb547);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .pkt {
        white-space: nowrap;
      }
      .ttl {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .soonb {
        line-height: 1;
        padding: 7px 12px;
      }
      .sub2 {
        margin: -6px 0 46px;
        color: #aaa29b;
        font-size: 22px;
      }
      .zk {
        display: grid;
        grid-template-columns: 260px 150px 260px 150px 260px;
        align-items: center;
      }
      .zk .node {
        width: auto;
        position: relative;
      }
      .zk .step {
        position: absolute;
        top: -12px;
        left: 18px;
        padding: 3px 10px;
        border-radius: 999px;
        background: #ff6a3d;
        color: #1b0a03;
        font:
          800 12px ui-monospace,
          Menlo,
          monospace;
        letter-spacing: 0.04em;
      }
      .zk .node.srv .step {
        background: #ffb547;
      }
      .zk .val {
        margin-top: 12px;
        padding: 8px 10px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.08);
        font:
          600 13px ui-monospace,
          Menlo,
          monospace;
        color: #e6dfd8;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .zk .val.enc {
        color: #ffb547;
      }
      .ic svg {
        width: 24px;
        height: 24px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .term {
        width: 980px;
      }
      .term .body {
        font-size: 15.5px;
      }
      .term .ok {
        color: #ff6a3d;
      }
      .term .num {
        color: #e6e6e6;
        font-weight: 700;
      }
      .mcp {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 14px;
        padding: 10px 14px;
        border-radius: 12px;
        background: rgba(255, 106, 61, 0.08);
        border: 1px solid rgba(255, 106, 61, 0.25);
        font:
          14px ui-monospace,
          Menlo,
          monospace;
        color: #e6dfd8;
        width: 980px;
        box-sizing: border-box;
        text-align: left;
      }
      .mcp b {
        color: #ff6a3d;
      }
      .agents {
        display: flex;
        gap: 10px;
        margin-top: 18px;
      }
      .agents span {
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 14px;
        font-weight: 600;
        color: #e6dfd8;
      }
      h1 img.lg {
        width: 0.86em;
        height: 0.86em;
        margin-right: 0.22em;
        vertical-align: -0.1em;
      }
      #hole {
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        z-index: 5;
        pointer-events: none;
        border-radius: 12px;
        opacity: 0;
        box-shadow: 0 0 0 2400px rgba(4, 3, 2, 0.58);
        transition: opacity 0.3s;
      }
      #hole::after {
        content: "";
        position: absolute;
        inset: -3px;
        border-radius: inherit;
        border: 2.5px solid #ffb547;
        animation: halo 1.3s ease-out infinite;
      }
      #hole.on {
        opacity: 1;
      }
      @keyframes halo {
        0% {
          box-shadow: 0 0 0 0 rgba(255, 181, 71, 0.55);
        }
        100% {
          box-shadow: 0 0 0 14px rgba(255, 181, 71, 0);
        }
      }
      #callout {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 6;
        padding: 9px 16px;
        border-radius: 999px;
        background: #ffb547;
        color: #2a1a00;
        font-weight: 750;
        font-size: 19px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      }
      #callout::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -6px;
        width: 13px;
        height: 13px;
        margin-left: -6.5px;
        background: #ffb547;
        transform: rotate(45deg);
        border-radius: 2px;
      }
      #callout.below::after {
        bottom: auto;
        top: -6px;
      }
      #callout.on {
        opacity: 1;
      }
      .dia {
        position: relative;
        text-align: left;
      }
      .dia > .n {
        position: absolute;
        box-sizing: border-box;
        padding: 14px 18px;
        border-radius: 16px;
        background: #171513;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.4);
        font-size: 21px;
        font-weight: 700;
        letter-spacing: -0.2px;
        z-index: 1;
      }
      .dia > .n small {
        display: block;
        margin-bottom: 4px;
        color: #aaa29b;
        font-size: 12.5px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .dia > .n.hl {
        border-color: rgba(255, 106, 61, 0.65);
        background: linear-gradient(180deg, rgba(255, 106, 61, 0.14), #171513 80%);
      }
      .dia .envs {
        display: flex;
        gap: 5px;
        margin-top: 10px;
      }
      .dia .envs i {
        padding: 3px 7px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        font-size: 12px;
        font-weight: 650;
        font-style: normal;
        color: #e6dfd8;
      }
      .dia .hd {
        position: absolute;
        top: 0;
        font-size: 13px;
        font-weight: 750;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #8d857e;
      }
      .dia .split {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1px;
        background: linear-gradient(
          180deg,
          transparent,
          rgba(255, 255, 255, 0.12) 20%,
          rgba(255, 255, 255, 0.12) 80%,
          transparent
        );
      }
      .dia .key {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .dia .key .kic {
        width: 46px;
        height: 46px;
        margin-bottom: 10px;
        border-radius: 13px;
        display: grid;
        place-items: center;
        background: #ff6a3d;
        color: #1b0a03;
      }
      .dia .mono {
        margin-top: 4px;
        font:
          600 13px ui-monospace,
          Menlo,
          monospace;
        color: #ffb547;
      }
      .dia .mem {
        display: grid;
        grid-template-columns: 40px 1fr;
        column-gap: 12px;
        align-items: center;
        font-size: 17px;
      }
      .dia .mem .av {
        grid-row: span 2;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(255, 106, 61, 0.18);
        color: #ff6a3d;
        font-size: 16px;
        font-weight: 800;
      }
      .dia .mem .sl {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 3px;
        color: #8d857e;
        font-size: 12.5px;
        white-space: nowrap;
        font-weight: 600;
        transition: color 0.3s;
      }
      .dia .mem .sl svg {
        width: 15px;
        height: 15px;
      }
      .dia .mem.sealed {
        border-color: rgba(255, 181, 71, 0.55);
      }
      .dia .mem.sealed .sl {
        color: #ffb547;
      }
      .dia .foot {
        position: absolute;
        font-size: 16px;
        color: #aaa29b;
      }
      .dia svg.wires {
        position: absolute;
        left: 0;
        top: 0;
        overflow: visible;
        pointer-events: none;
        z-index: 0;
      }
      .wires .ln {
        fill: none;
        stroke: rgba(255, 140, 90, 0.75);
        stroke-width: 2.2;
        stroke-linecap: round;
        animation: draw 0.6s cubic-bezier(0.45, 0, 0.2, 1) both;
      }
      .wires .ah {
        fill: rgba(255, 140, 90, 0.95);
        animation: fadein 0.2s both;
      }
      @keyframes draw {
        from {
          stroke-dashoffset: var(--len);
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes fadein {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .dia .tok {
        position: absolute;
        left: 0;
        top: 0;
        width: 30px;
        height: 30px;
        margin: 0;
        border-radius: 9px;
        display: grid;
        place-items: center;
        background: #ff6a3d;
        color: #1b0a03;
        box-shadow: 0 6px 18px rgba(255, 106, 61, 0.45);
        offset-rotate: 0deg;
        opacity: 0;
        z-index: 2;
        animation: travel 0.9s cubic-bezier(0.5, 0, 0.3, 1) both;
      }
      .dia .tok svg,
      .dia .key .kic svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .dia .key .kic svg {
        width: 24px;
        height: 24px;
      }
      @keyframes travel {
        0% {
          offset-distance: 0%;
          opacity: 0;
        }
        15% {
          opacity: 1;
        }
        85% {
          opacity: 1;
        }
        100% {
          offset-distance: 100%;
          opacity: 0;
        }
      }
      .dia .mem .sl svg,
      .zk svg.arw {
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .zk .lane {
        position: relative;
        height: 24px;
        margin: 0 8px;
        background: none;
      }
      .zk svg.arw {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 24px;
        color: #ff8a5c;
        overflow: visible;
      }
      .zk svg.arw path:first-child {
        stroke-dasharray: 120;
        animation: draw 0.6s cubic-bezier(0.45, 0, 0.2, 1) both;
        --len: 120;
      }
      .zk svg.arw path + path {
        fill: #ff8a5c;
        stroke: none;
        animation: fadein 0.2s both;
      }
      .zk .lane .pkt {
        top: -22px;
      }
      .zk .lane .pkt {
        animation-name: flyz;
        animation-delay: 1s;
        animation-fill-mode: both;
      }
      @keyframes flyz {
        0% {
          left: 0;
          opacity: 0;
        }
        15% {
          opacity: 1;
        }
        85% {
          opacity: 1;
        }
        100% {
          left: calc(100% - 78px);
          opacity: 0;
        }
      }
      .dia > .n,
      .dia .hd,
      .dia .foot,
      .dia .split {
        animation: pop 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
    </style>
  </head>
  <body>
    <div id="bg"></div>
    <div id="grid"></div>
    <div id="camera">
      <div id="device"><iframe id="frame"></iframe></div>
      <div id="ripple"></div>
      <svg id="cursor" viewBox="0 0 24 24">
        <path
          d="M4 2l15 10-7 1.5L8.5 21z"
          fill="#fff"
          stroke="#000"
          stroke-width="1.3"
          stroke-linejoin="round"
        />
      </svg>
    </div>
    <div id="hole"></div>
    <div id="callout"></div>
    <div id="cap"></div>
    <div id="card"></div>
    <script>
      const $ = (id) => document.getElementById(id);
      const S = { k: 1, tx: 0, ty: 0, scale: 1, dx: 0, dy: 0, spot: null, call: null };
      const camMatrix = () => new DOMMatrix(getComputedStyle($("camera")).transform);
      const toLocal = (x, y) => {
        const p = camMatrix().inverse().transformPoint(new DOMPoint(x, y));
        return { x: p.x, y: p.y };
      };
      window.st = {
        device(src, w, h, scale) {
          const d = $("device"),
            f = $("frame");
          f.src = src;
          f.width = w;
          f.height = h;
          d.style.width = w * scale + "px";
          d.style.height = h * scale + "px";
          f.style.transform = `scale(${scale})`;
          S.scale = scale;
          S.dx = (1280 - w * scale) / 2;
          S.dy = Math.max(140, (720 - h * scale) / 2 + 40);
          d.style.left = S.dx + "px";
          d.style.top = S.dy + "px";
        },
        show(on) {
          $("device").classList.toggle("on", on);
        },
        doc() {
          return $("frame").contentDocument;
        },
        win() {
          return $("frame").contentWindow;
        },
        rect(sel) {
          const e = typeof sel === "string" ? st.doc().querySelector(sel) : sel;
          if (!e) return null;
          const r = e.getBoundingClientRect();
          const f = $("frame");
          const F = f.getBoundingClientRect();
          const k = F.width / parseFloat(f.width);
          return { x: F.left + r.left * k, y: F.top + r.top * k, w: r.width * k, h: r.height * k };
        },
        local(sel) {
          const r = st.rect(sel);
          if (!r) return null;
          const c = toLocal(r.x + r.w / 2, r.y + r.h / 2);
          return { x: c.x, y: c.y, w: r.w / S.k, h: r.h / S.k };
        },
        reveal(sel, room = 0.5) {
          const e = st.doc().querySelector(sel);
          if (!e) return 0;
          const w = st.win();
          const r = e.getBoundingClientRect();
          const top = w.innerHeight * 0.18;
          const bottom = w.innerHeight * (1 - 0.12);
          if (r.top >= top && r.bottom <= bottom) return 0;
          const want = Math.max(0, w.scrollY + r.top + r.height / 2 - w.innerHeight * room);
          w.scrollTo({ top: want, behavior: "smooth" });
          return 1;
        },
        zoom(sel, k, ox, oy) {
          if (!sel) {
            S.k = 1;
            S.tx = 0;
            S.ty = 0;
          } else {
            const p = st.local(sel);
            if (!p) return false;
            S.k = k;
            S.tx = 640 + (ox || 0) - p.x * k;
            S.ty = 430 + (oy || 0) - p.y * k;
          }
          $("camera").style.transform = `translate(${S.tx}px,${S.ty}px) scale(${S.k})`;
          return true;
        },
        spot(sel, pad = 8, radius = 12) {
          clearTimeout(S.spotOff);
          $("hole").classList.toggle("on", !!sel);
          if (!sel) {
            S.spotOff = setTimeout(() => (S.spot = null), 350);
            return;
          }
          S.spot = { sel, pad, radius };
          st.tick(true);
        },
        callout(sel, text, place = "top") {
          const c = $("callout");
          clearTimeout(S.callOff);
          if (!sel) {
            c.classList.remove("on");
            S.callOff = setTimeout(() => (S.call = null), 350);
            return;
          }
          S.call = { sel, place };
          c.textContent = text;
          c.classList.toggle("below", place === "below");
          st.tick(true);
          c.classList.add("on");
        },
        tick(force) {
          if (S.spot) {
            const r = st.rect(S.spot.sel);
            if (r) {
              const h = $("hole"),
                p = S.spot.pad * S.k;
              h.style.transform = `translate(${r.x - p}px,${r.y - p}px)`;
              h.style.width = r.w + 2 * p + "px";
              h.style.height = r.h + 2 * p + "px";
              h.style.borderRadius = S.spot.radius * S.k + "px";
            }
          }
          if (S.call) {
            const r = st.rect(S.call.sel);
            if (r) {
              const c = $("callout");
              const pad = (S.spot ? S.spot.pad * S.k : 0) + 16;
              const x = r.x + r.w / 2 - c.offsetWidth / 2;
              const y = S.call.place === "below" ? r.y + r.h + pad : r.y - pad - c.offsetHeight;
              c.style.transform = `translate(${x}px,${y}px)`;
            }
          }
        },
        move(sel) {
          const p = st.local(sel);
          if (!p) return false;
          const c = $("cursor");
          c.style.opacity = 1;
          c.style.transform = `translate(${p.x - 4}px,${p.y - 2}px)`;
          S.cx = p.x;
          S.cy = p.y;
          return true;
        },
        click() {
          const r = $("ripple");
          r.style.left = S.cx + "px";
          r.style.top = S.cy + "px";
          r.classList.remove("go");
          void r.offsetWidth;
          r.classList.add("go");
        },
        hideCursor() {
          $("cursor").style.opacity = 0;
        },
        cap(k, h) {
          const c = $("cap");
          c.className = "out";
          setTimeout(() => {
            c.innerHTML = (k ? `<span class="k">${k}</span>` : "") + `<h2>${h}</h2>`;
            c.className = "in";
          }, 150);
        },
        nocap() {
          $("cap").className = "out";
        },
        card(html) {
          const c = $("card");
          c.classList.remove("on");
          c.innerHTML = html;
          void c.offsetWidth;
          c.classList.add("on");
          c.querySelectorAll(".dia[data-links]").forEach(st.wire);
        },
        nocard() {
          $("card").classList.remove("on");
        },
        wire(dia) {
          const NS = "http://www.w3.org/2000/svg";
          const svg = document.createElementNS(NS, "svg");
          svg.setAttribute("class", "wires");
          svg.setAttribute("width", dia.offsetWidth);
          svg.setAttribute("height", dia.offsetHeight);
          dia.prepend(svg);
          const box = (id) => {
            const e = dia.querySelector(`[data-id="${id}"]`);
            return { x: e.offsetLeft, y: e.offsetTop, w: e.offsetWidth, h: e.offsetHeight, e };
          };
          for (const spec of dia.dataset.links.split(";")) {
            const [pair, dir, at, tok] = spec.trim().split(":");
            const [a, b] = pair.split(">").map(box);
            const delay = parseFloat(at);
            let x1, y1, x2, y2, d, ang;
            const gap = 3;
            if (dir === "v") {
              x1 = a.x + a.w / 2;
              y1 = a.y + a.h;
              x2 = b.x + b.w / 2;
              y2 = b.y - gap;
              const m = (y2 - y1) / 2;
              d = `M${x1},${y1} C${x1},${y1 + m} ${x2},${y2 - m} ${x2},${y2}`;
              ang = 90;
            } else {
              x1 = a.x + a.w;
              y1 = a.y + a.h / 2;
              x2 = b.x - gap;
              y2 = b.y + b.h / 2;
              const m = (x2 - x1) / 2;
              d = `M${x1},${y1} C${x1 + m},${y1} ${x2 - m},${y2} ${x2},${y2}`;
              ang = 0;
            }
            const path = document.createElementNS(NS, "path");
            path.setAttribute("d", d);
            path.setAttribute("class", "ln");
            svg.append(path);
            const len = path.getTotalLength();
            path.style.strokeDasharray = len;
            path.style.setProperty("--len", len);
            path.style.animationDelay = delay + "s";
            const tip = path.getPointAtLength(len - 9);
            const head = document.createElementNS(NS, "path");
            head.setAttribute("d", "M0,0 L-11,-6 L-11,6 Z");
            head.setAttribute("class", "ah");
            const rot = (Math.atan2(y2 - tip.y, x2 - tip.x) * 180) / Math.PI;
            head.setAttribute("transform", `translate(${x2},${y2}) rotate(${rot || ang})`);
            head.style.animationDelay = delay + 0.5 + "s";
            svg.append(head);
            if (tok) {
              const t = document.createElement("div");
              t.className = "tok";
              t.innerHTML = dia.querySelector("template.tokt")?.innerHTML ?? "";
              t.style.offsetPath = `path("${d}")`;
              t.style.animationDelay = parseFloat(tok) + "s";
              dia.append(t);
              setTimeout(() => b.e.classList.add("sealed"), (parseFloat(tok) + 0.85) * 1000);
            }
          }
        },
      };
      const loop = () => {
        try {
          st.tick();
        } catch {}
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
