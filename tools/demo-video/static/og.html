<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0b1113;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        color: #eef5f3;
      }
      .bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(700px 420px at 15% 10%, rgba(79, 224, 195, 0.22), transparent 60%),
          radial-gradient(600px 400px at 100% 100%, rgba(79, 224, 195, 0.1), transparent 60%);
      }
      .copy {
        position: absolute;
        left: 72px;
        top: 96px;
        width: 520px;
      }
      .mark {
        font-weight: 800;
        font-size: 44px;
        letter-spacing: -1px;
      }
      .mark b {
        color: #4fe0c3;
      }
      h1 {
        margin: 34px 0 18px;
        font-size: 50px;
        line-height: 1.06;
        letter-spacing: -1.6px;
      }
      p {
        margin: 0;
        font-size: 22px;
        line-height: 1.45;
        color: #a9bdb9;
      }
      img {
        position: absolute;
        right: -40px;
        top: 110px;
        width: 600px;
        border-radius: 14px;
        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(255, 255, 255, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="copy">
      <div class="mark"><b>7</b>key</div>
      <h1 id="h"></h1>
      <p id="p"></p>
    </div>
    <img id="i" />
    <script>
      const vi = location.search.includes("vi");
      document.getElementById("h").textContent = vi
        ? "Mật khẩu, mã 2FA và secret của team"
        : "Passwords, 2FA codes and team secrets";
      document.getElementById("p").textContent = vi
        ? "Mã hoá đầu-cuối. Miễn phí cho cá nhân."
        : "End-to-end encrypted. Free for personal use.";
      document.getElementById("i").src = vi ? "popup-vi.webp" : "popup-en.webp";
    </script>
  </body>
</html>
