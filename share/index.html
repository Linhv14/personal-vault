<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <title>7key</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* @tokens */
      :root {
        --radius: 14px;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 40px 16px 24px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 20px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
      }
      .logo {
        display: inline-block;
        flex-shrink: 0;
      }
      .logo svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .wordmark {
        color: var(--text);
        font-size: 20px;
        font-weight: 750;
        letter-spacing: -0.03em;
      }
      .wordmark-accent {
        color: var(--accent);
      }
      .brand .icon {
        color: var(--accent);
      }
      .card {
        width: 100%;
        max-width: 460px;
        padding: 28px;
        border-radius: 20px;
        background: var(--card);
        border: 1px solid var(--border);
        box-shadow:
          0 1px 2px rgb(0 0 0 / 0.04),
          0 12px 32px rgb(0 0 0 / 0.06);
      }
      footer a {
        color: inherit;
      }
      footer {
        margin-top: auto;
        padding-top: 24px;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }

      .icon {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }

      .state {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 6px;
      }
      .state-mark {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        margin-bottom: 8px;
        border-radius: 16px;
        background: var(--accent-soft);
        color: var(--accent);
      }
      .state-mark .icon {
        width: 26px;
        height: 26px;
      }
      .state-mark.muted {
        background: var(--surface);
        color: var(--muted);
      }
      h1 {
        margin: 0;
        font-size: 19px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      .sub {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }
      .spinner {
        width: 28px;
        height: 28px;
        margin-bottom: 10px;
        border-radius: 50%;
        border: 3px solid var(--surface);
        border-top-color: var(--accent);
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
        margin-top: 18px;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid transparent;
        background: var(--surface);
        color: var(--text);
        font: inherit;
      }
      input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--focus-halo);
      }
      button {
        font: inherit;
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
      }
      button.primary {
        padding: 12px;
        border-radius: 12px;
        background: var(--accent);
        color: var(--accent-text);
        font-weight: 600;
      }
      .eyebrow {
        margin: 0 0 2px;
        color: var(--muted);
        font-size: 12.5px;
        font-weight: 500;
      }
      .code-input {
        text-align: center;
        font:
          600 22px/1 ui-monospace,
          "SF Mono",
          Menlo,
          Consolas,
          monospace;
        letter-spacing: 0.4em;
      }
      .code-links {
        display: flex;
        justify-content: center;
        gap: 16px;
      }
      button.link {
        padding: 4px 2px;
        color: var(--accent);
        font-size: 13px;
        font-weight: 600;
      }
      button.link:disabled {
        color: var(--muted);
        cursor: default;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        padding: 10px 16px;
        border-radius: 999px;
        background: var(--text);
        color: var(--bg);
        font-size: 13px;
        box-shadow: 0 8px 24px rgb(0 0 0 / 0.2);
      }
      .error {
        margin: 4px 0 0;
        color: var(--danger);
        font-size: 13px;
      }

      .head {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 18px;
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        border-radius: 14px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 20px;
        font-weight: 700;
        flex-shrink: 0;
      }
      .head-text {
        min-width: 0;
      }
      .head-text h1 {
        display: -webkit-box;
        overflow: hidden;
        overflow-wrap: break-word;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .value a.site {
        display: flex;
        min-width: 0;
        white-space: nowrap;
      }
      .site-host {
        flex: none;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .site-path {
        min-width: 0;
        overflow: hidden;
        color: var(--muted);
        text-overflow: ellipsis;
      }
      @media (max-width: 520px) {
        main {
          padding: 20px 12px 16px;
        }
        .brand {
          margin-bottom: 14px;
        }
        .card {
          padding: 16px;
          border-radius: 16px;
        }
        .head {
          gap: 12px;
          margin-bottom: 14px;
        }
        .avatar {
          width: 40px;
          height: 40px;
          border-radius: 12px;
          font-size: 18px;
        }
        h1 {
          font-size: 17px;
        }
        .field {
          padding: 9px 4px 9px 12px;
        }
        .icon-button {
          width: 34px;
          height: 34px;
        }
      }

      .fields {
        margin: 0 -12px;
      }
      .site {
        display: flex;
        align-items: center;
        gap: 2px;
        min-width: 0;
        margin-top: 2px;
      }
      .site-link {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
        color: var(--accent);
        font-size: 14px;
        text-decoration: none;
      }
      .site-link:hover {
        text-decoration: underline;
      }
      .site-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .site-link .icon {
        width: 14px;
        height: 14px;
      }
      .site .icon-button {
        width: 30px;
        height: 30px;
      }
      .site .icon-button .icon {
        width: 15px;
        height: 15px;
      }
      .meta {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 18px 0 0;
        padding-top: 14px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 12.5px;
      }
      .meta .icon {
        width: 14px;
        height: 14px;
      }
      .field {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 10px 6px 10px 12px;
        border-radius: 12px;
        cursor: pointer;
        transition: background 0.12s;
      }
      .field:hover {
        background: var(--surface);
      }
      .field + .field {
        margin-top: 2px;
      }
      .field-body {
        flex: 1;
        min-width: 0;
      }
      .label {
        font-size: 12px;
        color: var(--muted);
      }
      .value {
        overflow-wrap: anywhere;
      }
      .value.mono {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 14px;
        letter-spacing: 0.02em;
      }
      .value.masked {
        letter-spacing: 0.15em;
      }
      .value a {
        color: var(--accent);
        text-decoration: none;
      }
      .value a:hover {
        text-decoration: underline;
      }
      .value.note {
        white-space: pre-wrap;
      }
      .icon-button {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 10px;
        color: var(--muted);
        flex-shrink: 0;
      }
      .icon-button:hover {
        background: var(--surface-hover);
        color: var(--text);
      }
      .icon-button.done {
        color: var(--ok);
      }
      .totp {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 2px;
      }
      .code {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 26px;
        letter-spacing: 0.08em;
        font-variant-numeric: tabular-nums;
      }
      .ring circle {
        fill: none;
        stroke-width: 3;
      }
      .ring .track {
        stroke: var(--border);
      }
      .ring .progress {
        stroke: var(--accent);
        stroke-linecap: round;
        transform: rotate(-90deg);
        transform-origin: 50% 50%;
        transition: stroke-dashoffset 0.95s linear;
      }
      .ring.urgent .progress {
        stroke: var(--danger);
        transition: none;
      }

      .banner {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin: 0 0 18px;
        padding: 10px 12px;
        border-radius: 12px;
        background: var(--surface);
        color: var(--muted);
        font-size: 13px;
      }
      @media (max-width: 520px) {
        .banner {
          margin: 0 0 14px;
        }
      }
      .banner .icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        margin-top: 2px;
        color: var(--accent);
      }
      .banner strong {
        display: block;
        font-weight: 650;
      }
      .banner.last {
        background: var(--warn-soft);
        color: var(--text);
      }
      .banner.last .icon {
        color: var(--warn);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span data-logo="28"></span><span data-wordmark></span></div>
      <div class="card">
        <div class="state" id="state-loading">
          <div class="spinner"></div>
          <h1 data-i18n="view.loading"></h1>
        </div>

        <div class="state" id="state-passphrase" hidden>
          <span class="state-mark"><i data-icon="lock"></i></span>
          <h1 data-i18n="view.passphrase_title"></h1>
          <p class="sub" data-i18n="view.passphrase_hint"></p>
          <form id="passphrase-form">
            <input
              id="passphrase"
              type="password"
              autocomplete="off"
              required
              autofocus
              data-i18n-placeholder="view.passphrase_placeholder"
            />
            <button class="primary" type="submit" data-i18n="view.open"></button>
            <p id="passphrase-error" class="error" hidden></p>
          </form>
        </div>

        <div class="state" id="state-email" hidden>
          <span class="state-mark"><i data-icon="mail"></i></span>
          <h1 data-i18n="view.email_title"></h1>
          <p class="sub" data-i18n="view.email_hint"></p>
          <form id="email-form">
            <input
              id="recipient-email"
              type="email"
              autocomplete="email"
              required
              data-i18n-placeholder="view.email_placeholder"
            />
            <button class="primary" type="submit" data-i18n="view.send_code"></button>
          </form>
          <form id="code-form" hidden>
            <p class="sub" id="code-sent"></p>
            <input
              id="recipient-code"
              class="code-input"
              inputmode="numeric"
              autocomplete="one-time-code"
              maxlength="6"
              pattern="\d{6}"
              placeholder="000000"
              required
            />
            <button class="primary" type="submit" data-i18n="view.open"></button>
            <div class="code-links">
              <button type="button" class="link" id="code-resend"></button>
              <button
                type="button"
                class="link"
                id="code-change-email"
                data-i18n="view.change_email"
              ></button>
            </div>
          </form>
          <p id="email-error" class="error" hidden></p>
        </div>

        <div class="state" id="state-error" hidden>
          <span class="state-mark muted" id="error-mark"></span>
          <h1 id="error-title"></h1>
          <p class="sub" id="error-message"></p>
        </div>

        <div id="state-content" hidden>
          <div class="banner" id="banner" role="status" hidden></div>
          <div class="head">
            <span class="avatar" id="avatar"></span>
            <div class="head-text">
              <h1 id="title"></h1>
              <div id="site"></div>
            </div>
          </div>
          <div class="fields" id="fields"></div>
          <p class="meta" id="meta" hidden></p>
        </div>
      </div>
      <div class="toast" id="toast" role="status" hidden></div>
      <footer>
        <span data-i18n="view.footer"></span> ·
        <a href="/privacy" data-i18n="view.privacy"></a>
      </footer>
    </main>
    <script type="module" src="/share.js"></script>
  </body>
</html>
