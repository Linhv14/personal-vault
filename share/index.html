<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Không cho công cụ tìm kiếm lập chỉ mục link share. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <!-- Không gửi referrer: nếu người nhận bấm vào link trong phần ghi chú, URL
         này (kèm fragment ở một số browser cũ) không được chuyển sang trang đó. -->
    <meta name="referrer" content="no-referrer" />
    <title>Thông tin được chia sẻ</title>
    <style>
      :root {
        --bg: #0f1115;
        --card: #181b22;
        --border: #2a2f3a;
        --text: #e7e9ee;
        --muted: #9aa3b2;
        --accent: #6aa9ff;
        --danger: #ff6b6b;
        --ok: #4ade80;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f5f6f8;
          --card: #ffffff;
          --border: #e1e4ea;
          --text: #1a1d23;
          --muted: #5b6472;
          --accent: #1a6fe0;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      }
      main { width: 100%; max-width: 440px; }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px;
      }
      h1 { font-size: 18px; margin: 0 0 4px; }
      .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
      .field { border-top: 1px solid var(--border); padding: 12px 0; }
      .field:first-of-type { border-top: 0; }
      .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
      .row { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
      .value {
        flex: 1;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 15px;
        word-break: break-all;
      }
      .value.hidden { letter-spacing: .18em; }
      button {
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 5px 10px;
        font-size: 13px;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover { border-color: var(--accent); }
      button.primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
        width: 100%;
        padding: 10px;
        font-size: 15px;
      }
      input[type="password"] {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 15px;
      }
      .totp { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
      .code {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 30px;
        letter-spacing: .14em;
        font-variant-numeric: tabular-nums;
      }
      .ring { flex-shrink: 0; }
      .ring circle { fill: none; stroke-width: 3; }
      .ring .track { stroke: var(--border); }
      .ring .progress {
        stroke: var(--accent);
        stroke-linecap: round;
        transform: rotate(-90deg);
        transform-origin: 50% 50%;
        transition: stroke-dashoffset .95s linear;
      }
      .ring.urgent .progress { stroke: var(--danger); transition: none; }
      .note { white-space: pre-wrap; word-break: break-word; font-family: inherit; }
      .warn {
        margin-top: 16px;
        padding: 10px 12px;
        border-radius: 8px;
        background: color-mix(in srgb, var(--danger) 12%, transparent);
        border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent);
        font-size: 13px;
      }
      .error { color: var(--danger); }
      .copied { color: var(--ok); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <div id="state-loading">
          <h1>Đang mở…</h1>
          <p class="sub">Giải mã ngay trên máy bạn.</p>
        </div>

        <div id="state-passphrase" hidden>
          <h1>Cần mật khẩu phụ</h1>
          <p class="sub">
            Người gửi đã đặt thêm một mật khẩu và báo cho bạn qua kênh khác. Nội
            dung chỉ được tải về sau khi bạn nhập — mỗi lần tải là một lượt xem.
          </p>
          <form id="passphrase-form">
            <input
              id="passphrase"
              type="password"
              autocomplete="off"
              placeholder="Mật khẩu phụ"
              required
            />
            <button class="primary" type="submit">Mở</button>
          </form>
          <p id="passphrase-error" class="error" hidden></p>
        </div>

        <div id="state-error" hidden>
          <h1>Không mở được</h1>
          <p class="sub error" id="error-message"></p>
        </div>

        <div id="state-content" hidden>
          <h1 id="title">Thông tin được chia sẻ</h1>
          <p class="sub" id="meta"></p>
          <div id="fields"></div>
          <div class="warn" id="warning"></div>
        </div>
      </div>
    </main>
    <script type="module" src="/share.js"></script>
  </body>
</html>
