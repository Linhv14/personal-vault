<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>7key</title>
    <meta
      name="description"
      content="An end-to-end encrypted password manager with 2FA codes, shared vaults and secrets for the CLI and CI."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* @tokens */
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.65 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      main {
        max-width: 520px;
        padding: 40px 20px;
        text-align: center;
      }
      .mark {
        display: inline-block;
        width: 64px;
        height: 64px;
      }
      .mark svg {
        width: 100%;
        height: 100%;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 30px;
        font-weight: 750;
        letter-spacing: 0.01em;
      }
      .wordmark-accent {
        color: var(--accent);
      }
      p {
        margin: 0 0 28px;
        color: var(--muted);
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }
      nav a {
        padding: 9px 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        text-decoration: none;
      }
      nav a:hover {
        background: var(--surface);
      }
      nav a.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--accent-text);
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark">{{logo}}</span>
      <h1 aria-label="7key"><span class="wordmark-accent">7</span>KEY</h1>
      <p>
        An end-to-end encrypted password manager with 2FA codes, shared vaults and secrets for the
        CLI and CI.
      </p>
      <nav>
        <a class="primary" href="/app/">Open the web app</a>
        <!-- download -->
        <a href="/download/7key-extension.zip">Download the extension</a>
        <!-- /download -->
        <a href="/security">Security</a>
        <a href="/api-docs">API</a>
      </nav>
    </main>
  </body>
</html>
