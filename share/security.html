<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Security · Trust1 Vault</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* @tokens */
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.65 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      header {
        border-bottom: 1px solid var(--border);
      }
      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: 760px;
        margin: 0 auto;
        padding: 14px 20px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text);
        text-decoration: none;
      }
      .wordmark {
        font-size: 18px;
        font-weight: 750;
        letter-spacing: -0.03em;
      }
      .wordmark-accent {
        color: var(--accent);
      }
      .lang {
        font-size: 13px;
        color: var(--muted);
      }
      .lang a {
        color: var(--muted);
        text-decoration: none;
      }
      .lang a:hover {
        color: var(--text);
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 40px 20px 80px;
      }
      #vi,
      body:has(#vi:target) #en {
        display: none;
      }
      #vi:target {
        display: block;
      }
      h1 {
        margin: 0;
        font-size: 30px;
        letter-spacing: -0.02em;
      }
      .updated {
        margin: 6px 0 32px;
        color: var(--muted);
        font-size: 14px;
      }
      h2 {
        margin: 40px 0 10px;
        font-size: 18px;
      }
      p,
      li {
        margin: 0 0 12px;
      }
      ul {
        padding-left: 20px;
      }
      a {
        color: var(--accent);
      }
      .summary {
        padding: 18px 20px;
        border-radius: 12px;
        background: var(--surface);
      }
      .summary ul {
        margin: 0;
      }
      .summary li:last-child {
        margin-bottom: 0;
      }
      .table {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th,
      td {
        padding: 10px 12px 10px 0;
        border-bottom: 1px solid var(--border);
        text-align: left;
        vertical-align: top;
      }
      th {
        color: var(--muted);
        font-weight: 600;
        font-size: 13px;
      }
      td:first-child {
        font-weight: 550;
        width: 30%;
      }
      pre {
        overflow-x: auto;
        padding: 12px 14px;
        border-radius: 10px;
        background: var(--surface);
        font-size: 13px;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.92em;
      }
      .wordmark-product {
        margin-left: 0.18em;
        color: var(--muted);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <a class="brand" href="/">
          <img src="/favicon.svg" width="24" height="24" alt="" />
          <span class="wordmark"
            >Trust<span class="wordmark-accent">1</span>
            <span class="wordmark-product">Vault</span></span
          >
        </a>
        <span class="lang"><a href="/privacy">Privacy</a></span>
      </div>
    </header>

    <main>
      <article>
        <!-- markdown:docs/explanation/threat-model.md -->
      </article>
    </main>
  </body>
</html>
