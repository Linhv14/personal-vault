name = "personal-vault"
main = "src/worker/index.ts"
compatibility_date = "2025-10-01"

# The share page is a static asset; the Worker only handles /api/* and /s/*.
[assets]
directory = "./dist/public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "vault"
# `npm run deploy` replaces this placeholder with the database id in YOUR account and
# writes the result to .wrangler.local.toml (gitignored). This file stays
# generic so the public repository carries nobody's identifiers.
database_id = "SET_BY_DEPLOY"
migrations_dir = "migrations"

# Purge expired share links. Without the cron, expired ciphertext lingers in D1;
# still unreadable, but keeping data longer than necessary is a needless risk.
# Per-IP limit on every endpoint reachable without a session (register,
# prelogin, login, reading a share). The per-email lockout in auth.ts stops
# password guessing; this stops one client from burning the free-tier quota.
[[ratelimits]]
name = "ANONYMOUS_RATE_LIMITER"
namespace_id = "7301"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "REGISTRATION_RATE_LIMITER"
namespace_id = "7302"
simple = { limit = 5, period = 60 }

# Per-account cap on writes (items, shares), so one account cannot flood D1.
[[ratelimits]]
name = "ACCOUNT_RATE_LIMITER"
namespace_id = "7303"
simple = { limit = 60, period = 60 }

# "token" (default): creating an account needs REGISTRATION_TOKEN, right for a
# personal Worker. "open": anyone can sign up, for a shared hosted server; set
# it with `npm run deploy -- --open-registration`.
[vars]
REGISTRATION_MODE = "token"

[triggers]
crons = ["17 * * * *"]

[observability]
enabled = true

# Secrets are generated and uploaded by `npm run deploy`. To set them manually:
#   npx wrangler secret put REGISTRATION_TOKEN -c .wrangler.local.toml
#
#   REGISTRATION_TOKEN — required by /api/auth/register. Without it, anyone who
#                        finds the URL can create an account.
#   EMAIL_PROBE_SECRET — HMAC key used to fabricate KDF parameters for addresses
#                        that do not exist, so registrations cannot be probed.
#   AT_REST_SECRET     — protects auth_key_hash and wrapped_vault_key in D1, so a
#                        leaked database cannot be attacked offline. Back it
#                        up: losing it locks every account out.
