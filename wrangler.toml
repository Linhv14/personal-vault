name = "personal-vault"
main = "src/worker/index.ts"
compatibility_date = "2026-10-13"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true
preview_urls = false

[assets]
directory = "./dist/public"
binding = "ASSETS"
run_worker_first = ["/", "/vi", "/privacy", "/media/*", "/security"]

[[d1_databases]]
binding = "DB"
database_name = "vault"
database_id = "SET_BY_DEPLOY"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "USER_STORE"
class_name = "UserStore"

[[durable_objects.bindings]]
name = "ORG_STORE"
class_name = "OrgStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserStore"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["OrgStore"]

[[ratelimits]]
name = "ANONYMOUS_RATE_LIMITER"
namespace_id = "7301"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "REGISTRATION_RATE_LIMITER"
namespace_id = "7302"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "ACCOUNT_RATE_LIMITER"
namespace_id = "7303"
simple = { limit = 60, period = 60 }

[vars]
REGISTRATION_MODE = "token"

[triggers]
crons = ["17 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[secrets]
required = ["REGISTRATION_TOKEN", "EMAIL_PROBE_SECRET", "AT_REST_SECRET"]
