<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>1PW</title>
  </head>
  <body>
    <section id="screen-setup" class="screen" hidden>
      <div id="setup-choice">
        <div class="brand">
          <h1 class="lockup"><span data-logo="44"></span><span data-wordmark></span></h1>
          <p class="tagline" data-i18n="setup.tagline"></p>
        </div>
        <div class="choices">
          <button class="choice" id="setup-mode-create">
            <span class="choice-icon"><i data-icon="plus"></i></span>
            <span class="choice-text">
              <strong data-i18n="setup.mode_create"></strong>
              <small data-i18n="setup.mode_create_hint"></small>
            </span>
          </button>
          <button class="choice" id="setup-mode-signin">
            <span class="choice-icon"><i data-icon="lock"></i></span>
            <span class="choice-text">
              <strong data-i18n="setup.mode_signin"></strong>
              <small data-i18n="setup.mode_signin_hint"></small>
            </span>
          </button>
        </div>
      </div>
      <div id="setup-form-wrap" hidden>
        <header class="title-bar">
          <button class="icon-button" id="setup-back" data-i18n-title="common.back">
            <i data-icon="back"></i>
          </button>
          <h1 id="setup-form-title"></h1>
        </header>
        <form id="form-setup" class="stack">
          <label id="setup-server-field" hidden
            ><span data-i18n="setup.server"></span
            ><input
              name="apiUrl"
              type="url"
              placeholder="https://personal-vault.you.workers.dev"
              required
          /></label>
          <label
            ><span data-i18n="setup.email"></span
            ><input name="email" type="email" autocomplete="username" required
          /></label>
          <label
            ><span data-i18n="setup.registration_token"></span
            ><input
              name="registrationToken"
              type="password"
              autocomplete="off"
              data-i18n-placeholder="setup.registration_token_hint"
              required
          /></label>
          <div class="code-step" id="setup-code-field" hidden>
            <p class="hint" id="setup-code-hint"></p>
            <input
              name="verificationCode"
              inputmode="numeric"
              autocomplete="one-time-code"
              maxlength="6"
              pattern="\d{6}"
              placeholder="000000"
            />
            <div class="code-links">
              <button
                type="button"
                class="link"
                id="setup-code-resend"
                data-i18n="setup.code_resend"
              ></button>
              <button
                type="button"
                class="link"
                id="setup-code-change-email"
                data-i18n="setup.code_change_email"
              ></button>
            </div>
          </div>
          <label
            ><span data-i18n="setup.master_password"></span
            ><input
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="12"
              required
          /></label>
          <label
            ><span data-i18n="setup.confirm"></span
            ><input name="confirm" type="password" autocomplete="new-password" required
          /></label>
          <p class="hint" id="setup-hint"></p>
          <button class="primary" type="submit" data-i18n="setup.create"></button>
          <button
            type="button"
            class="link quiet"
            id="setup-custom-server"
            data-i18n="setup.custom_server"
          ></button>
        </form>
        <p class="error" id="setup-error" hidden></p>
      </div>
    </section>

    <section id="screen-unlock" class="screen" hidden>
      <div class="brand">
        <h1 class="lockup"><span data-logo="40"></span><span data-wordmark></span></h1>
        <p class="tagline" id="unlock-email"></p>
      </div>
      <form id="form-unlock" class="stack">
        <input
          name="password"
          type="password"
          autocomplete="current-password"
          data-i18n-placeholder="setup.master_password"
          required
          autofocus
        />
        <button class="primary" type="submit" data-i18n="unlock.submit"></button>
      </form>
      <p class="error" id="unlock-error" hidden></p>
      <div class="screen-footer">
        <button
          type="button"
          class="link quiet"
          id="unlock-reset"
          data-i18n="unlock.reset"
        ></button>
      </div>
    </section>

    <section id="screen-list" class="screen" hidden>
      <header class="toolbar">
        <span class="toolbar-logo" title="1PW"><span data-logo="26"></span></span>
        <label class="search">
          <i data-icon="search"></i>
          <input id="search" type="search" autocomplete="off" data-i18n-placeholder="list.search" />
        </label>
        <button class="icon-button accent" id="btn-add" data-i18n-title="list.add">
          <i data-icon="plus"></i>
        </button>
        <button class="icon-button" id="btn-generator" data-i18n-title="list.generator">
          <i data-icon="wand"></i>
        </button>
        <button class="icon-button" id="btn-settings" data-i18n-title="list.settings">
          <i data-icon="gear"></i>
        </button>
        <button class="icon-button" id="btn-lock" data-i18n-title="list.lock_now">
          <i data-icon="lock"></i>
        </button>
        <div class="add-menu" id="add-menu" role="menu" hidden></div>
      </header>
      <div class="sync-bar" id="sync-bar" hidden></div>
      <p class="sync-notice" id="sync-notice" hidden></p>
      <p class="warn" id="clock-warning" hidden></p>
      <div class="promo" id="autofill-promo" hidden>
        <span data-logo="24"></span>
        <span class="promo-text" data-i18n="list.autofill_promo"></span>
        <button class="link" id="autofill-promo-enable" data-i18n="list.autofill_enable"></button>
        <button class="icon-button" id="autofill-promo-close" data-i18n-title="common.close">
          <i data-icon="plus"></i>
        </button>
      </div>
      <div class="type-filter" id="type-filter" role="tablist"></div>
      <div id="matching-section" hidden>
        <h2 id="matching-title"></h2>
        <div class="list" id="matching-list"></div>
      </div>
      <h2 id="all-title"></h2>
      <div class="list" id="all-list"></div>
      <p class="hint center" id="list-empty-type" data-i18n="list.empty_type" hidden></p>
      <button type="button" class="secondary center-button" id="list-add-type" hidden></button>
      <div class="empty" id="list-empty" hidden>
        <span data-logo="44"></span>
        <p data-i18n="list.empty"></p>
        <button type="button" class="secondary" id="list-import" data-i18n="list.import"></button>
      </div>
    </section>

    <section id="screen-edit" class="screen" hidden>
      <header class="title-bar">
        <button class="icon-button" id="edit-back" data-i18n-title="common.back">
          <i data-icon="back"></i>
        </button>
        <h1 id="edit-title"></h1>
      </header>
      <form id="form-edit" class="stack">
        <label
          ><span data-i18n="edit.name"></span><input name="title" required autocomplete="off"
        /></label>
        <div class="stack" id="edit-fields"></div>
        <button class="primary" type="submit" data-i18n="edit.save"></button>
        <button
          type="button"
          class="link danger"
          id="edit-delete"
          data-i18n="edit.delete"
          hidden
        ></button>
      </form>
      <p class="error" id="edit-error" hidden></p>
    </section>

    <section id="screen-generator" class="screen" hidden>
      <header class="title-bar">
        <button class="icon-button" id="gen-back" data-i18n-title="common.back">
          <i data-icon="back"></i>
        </button>
        <h1 data-i18n="gen.title"></h1>
      </header>
      <div class="gen-output">
        <code id="gen-value"></code>
        <div class="gen-footer">
          <span class="meter"><span id="gen-meter"></span></span>
          <span id="gen-entropy"></span>
          <button class="icon-button" id="gen-again" data-i18n-title="gen.regenerate">
            <i data-icon="refresh"></i>
          </button>
          <button class="icon-button" id="gen-copy" data-i18n-title="common.copy">
            <i data-icon="copy"></i>
          </button>
        </div>
      </div>
      <div class="segmented">
        <button class="tab active" data-mode="password" data-i18n="gen.mode_random"></button>
        <button class="tab" data-mode="passphrase" data-i18n="gen.mode_passphrase"></button>
        <button class="tab" data-mode="pin" data-i18n="gen.mode_pin"></button>
      </div>
      <div class="options" id="gen-options-password">
        <label class="range"
          ><span data-i18n="gen.length"></span
          ><input id="gen-length" type="range" min="8" max="64" value="20" /><output
            id="gen-length-out"
          ></output
        ></label>
        <label class="check"
          ><span data-i18n="gen.uppercase"></span><input id="gen-upper" type="checkbox" checked
        /></label>
        <label class="check"
          ><span data-i18n="gen.digits"></span><input id="gen-digits" type="checkbox" checked
        /></label>
        <label class="check"
          ><span data-i18n="gen.symbols"></span><input id="gen-symbols" type="checkbox" checked
        /></label>
        <label class="check"
          ><span data-i18n="gen.exclude_ambiguous"></span
          ><input id="gen-unambiguous" type="checkbox"
        /></label>
      </div>
      <div class="options" id="gen-options-passphrase" hidden>
        <label class="range"
          ><span data-i18n="gen.words"></span
          ><input id="gen-words" type="range" min="4" max="12" value="8" /><output
            id="gen-words-out"
          ></output
        ></label>
        <label class="check"
          ><span data-i18n="gen.capitalize"></span><input id="gen-capitalize" type="checkbox"
        /></label>
        <label class="check"
          ><span data-i18n="gen.append_digit"></span><input id="gen-append-digit" type="checkbox"
        /></label>
      </div>
      <div class="options" id="gen-options-pin" hidden>
        <label class="range"
          ><span data-i18n="gen.pin_digits"></span
          ><input id="gen-pin" type="range" min="4" max="12" value="6" /><output
            id="gen-pin-out"
          ></output
        ></label>
      </div>
    </section>

    <section id="screen-share" class="screen" hidden>
      <header class="title-bar">
        <button class="icon-button" id="share-back" data-i18n-title="common.back">
          <i data-icon="back"></i>
        </button>
        <h1 data-i18n="share.title"></h1>
      </header>
      <form id="form-share" class="stack">
        <div class="share-subject" id="share-subject"></div>
        <section class="share-contents" aria-labelledby="share-contents-label">
          <span class="field-label" id="share-contents-label" data-i18n="share.contents"></span>
          <div class="chips" id="share-fields"></div>
          <small
            class="hint warn-text"
            id="share-totp-hint"
            data-i18n="share.totp_hint"
            hidden
          ></small>
        </section>
        <fieldset class="choice-group">
          <legend data-i18n="share.expires_in"></legend>
          <div class="segmented">
            <label class="tab"
              ><input type="radio" name="ttl" value="3600" /><span data-i18n="share.ttl_1h"></span
            ></label>
            <label class="tab"
              ><input type="radio" name="ttl" value="86400" checked /><span
                data-i18n="share.ttl_24h"
              ></span
            ></label>
            <label class="tab"
              ><input type="radio" name="ttl" value="604800" /><span data-i18n="share.ttl_7d"></span
            ></label>
            <label class="tab"
              ><input type="radio" name="ttl" value="2592000" /><span
                data-i18n="share.ttl_30d"
              ></span
            ></label>
          </div>
        </fieldset>
        <fieldset class="choice-group">
          <legend data-i18n="share.max_views"></legend>
          <div class="segmented">
            <label class="tab"
              ><input type="radio" name="maxViews" value="1" checked /><span
                data-i18n="share.views_1"
              ></span
            ></label>
            <label class="tab"
              ><input type="radio" name="maxViews" value="unlimited" /><span
                data-i18n="share.views_unlimited"
              ></span
            ></label>
          </div>
          <small class="hint" id="share-views-hint" data-i18n="share.views_hint" hidden></small>
        </fieldset>
        <details class="disclosure" id="share-protection">
          <summary>
            <span data-i18n="share.protection"></span
            ><span class="disclosure-state" id="share-protection-state"></span>
          </summary>
          <div class="stack">
            <fieldset class="choice-group" id="share-access-group">
              <legend data-i18n="share.access"></legend>
              <div class="segmented">
                <label class="tab"
                  ><input type="radio" name="access" value="anyone" checked /><span
                    data-i18n="share.access_anyone"
                  ></span
                ></label>
                <label class="tab"
                  ><input type="radio" name="access" value="emails" /><span
                    data-i18n="share.access_emails"
                  ></span
                ></label>
              </div>
            </fieldset>
            <div class="form-field" id="share-recipients-field" hidden>
              <span class="field-label"
                ><span data-i18n="share.recipients_label"></span
                ><span class="counter" id="share-recipients-count"></span
              ></span>
              <div class="chip-input" id="share-recipients">
                <input
                  id="share-recipient-entry"
                  type="email"
                  autocomplete="off"
                  data-i18n-placeholder="share.recipients_placeholder"
                  data-i18n-title="share.recipients_label"
                />
              </div>
              <small
                class="hint"
                id="share-recipients-hint"
                data-i18n="share.recipients_hint"
              ></small>
            </div>
            <label
              ><span data-i18n="share.passphrase"></span
              ><input
                name="passphrase"
                type="text"
                autocomplete="off"
                data-i18n-placeholder="share.passphrase_placeholder" /><small
                class="hint"
                data-i18n="share.passphrase_hint"
              ></small
            ></label>
          </div>
        </details>
        <div class="stack tight">
          <button class="primary" type="submit" data-i18n="share.create"></button>
          <p class="hint center" id="share-summary"></p>
        </div>
      </form>
      <div id="share-result" class="share-result" hidden>
        <div class="result-head">
          <span class="brand-mark"><i data-icon="check"></i></span>
          <h2 data-i18n="share.ready"></h2>
          <p class="hint" id="share-note"></p>
        </div>
        <input
          id="share-url"
          class="link-box"
          readonly
          data-i18n-title="share.link"
          aria-label="Link"
        />
        <button class="primary" id="share-copy" data-i18n="share.copy_link"></button>
        <p class="notice" id="share-passphrase-note" hidden>
          <i data-icon="lock"></i><span data-i18n="share.result_note_passphrase"></span>
        </p>
        <div class="screen-footer">
          <button
            type="button"
            class="link quiet"
            id="share-manage"
            data-i18n="share.manage"
          ></button>
        </div>
      </div>
      <p class="error" id="share-error" hidden></p>
    </section>

    <div id="toast" hidden></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
