<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>1PW</title>
    <link rel="icon" href="../icons/icon-32.png" />
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <header class="brand">
          <img src="../icons/icon-48.png" width="28" height="28" alt="" />
          <span class="wordmark"><span class="wordmark-accent">1</span>PW</span>
        </header>
        <nav class="nav" id="nav" aria-label="Settings">
          <a href="#general"
            ><i data-icon="gear"></i><span data-i18n="settings.section_preferences"></span
          ></a>
          <a href="#security"
            ><i data-icon="shield"></i><span data-i18n="settings.section_security"></span
          ></a>
          <a href="#health"><i data-icon="pulse"></i><span data-i18n="health.title"></span></a>
          <a href="#data"
            ><i data-icon="database"></i><span data-i18n="settings.section_data"></span
          ></a>
          <a href="#account"
            ><i data-icon="person"></i><span data-i18n="settings.section_account"></span
          ></a>
        </nav>
      </aside>

      <main>
        <p class="notice" id="signed-out" data-i18n="settings.signed_out" hidden></p>

        <section class="page" id="page-general" hidden>
          <h1 data-i18n="settings.section_preferences"></h1>
          <div class="card rows">
            <label class="row">
              <span class="row-text"><span data-i18n="settings.language"></span></span>
              <select id="settings-locale"></select>
            </label>
            <label class="row">
              <span class="row-text">
                <span data-i18n="settings.auto_lock"></span>
                <span class="row-hint" data-i18n="settings.auto_lock_hint"></span>
              </span>
              <select id="settings-lock"></select>
            </label>
            <label class="row" id="settings-autofill-row">
              <span class="row-text">
                <span data-i18n="settings.autofill"></span>
                <span class="row-hint" data-i18n="settings.autofill_hint"></span>
              </span>
              <input id="settings-autofill" type="checkbox" class="switch" />
            </label>
          </div>
        </section>

        <section class="page" id="page-security" hidden>
          <h1 data-i18n="settings.section_security"></h1>
          <div class="card">
            <h2 data-i18n="settings.change_password"></h2>
            <p class="row-hint" data-i18n="settings.change_hint"></p>
            <p class="notice" data-locked data-i18n="settings.locked_hint" hidden></p>
            <form id="form-change-password" class="stack" data-unlocked>
              <input
                name="current"
                type="password"
                autocomplete="current-password"
                data-i18n-placeholder="settings.current_password"
                required
              />
              <input
                name="next"
                type="password"
                minlength="12"
                autocomplete="new-password"
                data-i18n-placeholder="settings.new_password"
                required
              />
              <input
                name="confirm"
                type="password"
                autocomplete="new-password"
                data-i18n-placeholder="setup.confirm"
                required
              />
              <p class="error" id="change-error" role="alert" hidden></p>
              <button
                class="button primary"
                type="submit"
                data-i18n="settings.change_submit"
              ></button>
            </form>
          </div>
        </section>

        <section class="page" id="page-health" hidden>
          <h1 data-i18n="health.title"></h1>
          <p class="lead" data-i18n="health.lead"></p>
          <p class="notice" data-locked data-i18n="settings.locked_hint" hidden></p>
          <div data-unlocked>
            <div class="stats">
              <div class="stat" id="stat-weak">
                <span class="stat-number"></span
                ><span class="stat-label" data-i18n="health.weak"></span>
              </div>
              <div class="stat" id="stat-reused">
                <span class="stat-number"></span
                ><span class="stat-label" data-i18n="health.reused"></span>
              </div>
              <div class="stat" id="stat-breached">
                <span class="stat-number"></span
                ><span class="stat-label" data-i18n="health.breached"></span>
              </div>
            </div>
            <div class="card breach-check">
              <div class="row-text">
                <span data-i18n="health.check_breaches"></span>
                <span class="row-hint" data-i18n="health.breach_privacy"></span>
              </div>
              <button class="button" id="check-breaches" data-i18n="health.check"></button>
            </div>
            <p class="error" id="health-error" role="alert" hidden></p>
            <p class="notice" id="health-ok" data-i18n="health.all_good" hidden></p>
            <div id="health-lists"></div>
          </div>
        </section>

        <section class="page" id="page-data" hidden>
          <h1 data-i18n="settings.section_data"></h1>
          <div class="card rows">
            <div class="row">
              <span class="row-text">
                <span data-i18n="settings.import"></span>
                <span class="row-hint" data-i18n="settings.import_hint"></span>
              </span>
              <a class="button" href="../import/import.html" data-i18n="settings.import_open"></a>
            </div>
          </div>
          <h2 data-i18n="links.title"></h2>
          <div class="card">
            <p class="notice" data-locked data-i18n="settings.locked_hint" hidden></p>
            <div data-unlocked>
              <div class="links" id="links-list"></div>
              <p class="row-hint" id="links-empty" data-i18n="links.empty" hidden></p>
              <p class="error" id="links-error" role="alert" hidden></p>
              <p class="row-hint footnote" data-i18n="links.only_this_device"></p>
            </div>
          </div>
        </section>

        <section class="page" id="page-account" hidden>
          <h1 data-i18n="settings.section_account"></h1>
          <div class="card rows">
            <div class="row">
              <span data-i18n="settings.account_email"></span
              ><span class="value" id="account-email"></span>
            </div>
            <div class="row">
              <span data-i18n="settings.server"></span
              ><span class="value" id="account-server"></span>
            </div>
            <div class="row">
              <span data-i18n="settings.item_count"></span
              ><span class="value" id="account-count"></span>
            </div>
            <div class="row">
              <span data-i18n="settings.last_sync"></span
              ><span class="value" id="account-sync"></span>
            </div>
            <div class="row">
              <span class="row-text">
                <span data-i18n="settings.logout"></span>
                <span class="row-hint" data-i18n="settings.logout_hint"></span>
              </span>
              <button
                class="button"
                id="settings-logout"
                data-i18n="settings.logout_short"
              ></button>
            </div>
          </div>
          <h2 class="danger-title" data-i18n="settings.danger_zone"></h2>
          <div class="card danger-card">
            <h3 data-i18n="settings.delete_account"></h3>
            <p class="row-hint" data-i18n="settings.delete_hint"></p>
            <form id="form-delete-account" class="stack">
              <input
                name="current"
                type="password"
                autocomplete="current-password"
                data-i18n-placeholder="settings.current_password"
                required
              />
              <p class="error" id="delete-error" role="alert" hidden></p>
              <button
                class="button danger"
                type="submit"
                data-i18n="settings.delete_submit"
              ></button>
            </form>
          </div>
          <p class="about">
            <span id="about-version"></span> ·
            <a id="privacy-link" target="_blank" rel="noopener" data-i18n="settings.privacy"></a>
          </p>
        </section>
      </main>
    </div>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="settings.js"></script>
  </body>
</html>
