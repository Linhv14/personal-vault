name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Two projects: browser code and Worker code have conflicting globals, so
      # they cannot share one tsconfig.
      - run: npm run typecheck

      - run: npm run format:check

      - run: npm test

      # Catches a broken build before anyone deploys, since the share page and
      # the extension are built from the same sources the tests exercise.
      - run: npm run build
